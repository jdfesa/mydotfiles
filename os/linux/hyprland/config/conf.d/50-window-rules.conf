# Keep common dialogs manageable without encoding application-specific policy.
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(Open File|Save File|Choose Files)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol|nm-connection-editor)$

# Kitty is shared across platforms but tagged here only for compositor behavior.
windowrule = tag +terminal, match:class ^(kitty)$
windowrule = opacity 0.96 0.92, match:tag terminal
