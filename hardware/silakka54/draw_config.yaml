draw_config:
  key_h: 62
  dark_mode: true
  n_columns: 1
  footer_text: '×: uso evitado (activa) · Centro: toque · Abajo: mantener · 1-shot: próxima tecla · ▽: transparente · Símbolos US'
  # Preserve keymap-drawer's default styles and work without remote fonts.
  svg_extra_style: |
    svg.keymap { font-family: "JetBrains Mono", monospace; background: #181b20; }
    text, tspan { fill: #f5f7fa; stroke: none; }
    text.tap { font-size: 13px; font-weight: 700; }
    text.hold, text.shifted { font-size: 10px; }
    text.label { font-size: 20px; font-weight: 700; }
    rect.key { fill: #303640; stroke: #69727f; }
    rect.key.destructive { fill: #a82c36; }
    rect.key.layer { fill: #126496; }
    rect.key.trans { fill: #232830; stroke: #414955; }
    text.key.trans { fill: #8993a2; }
    rect.key.avoided { stroke: #e9ad55; stroke-width: 1.5; stroke-dasharray: 4 3; }
    text.key.avoided.tr { fill: #ffc373; font-size: 18px; font-weight: 700; }
    text.footer { font-size: 12px; }
