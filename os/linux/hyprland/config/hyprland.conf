# Hyprland entry point managed by ~/mydotfiles.
# Keep compositor concerns here; reusable Wayland tools live in os/linux/wayland.

source = ~/.config/hypr/conf.d/00-environment.conf
source = ~/.config/hypr/conf.d/10-monitors.conf
source = ~/.config/hypr/conf.d/20-input.conf
source = ~/.config/hypr/conf.d/30-appearance.conf
source = ~/.config/hypr/conf.d/40-bindings.conf
source = ~/.config/hypr/conf.d/50-window-rules.conf
source = ~/.config/hypr/conf.d/60-autostart.conf
