name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-terminal:
    name: Isolated Linux terminal tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Test tmux and clipboard without active sessions
        run: scripts/test-linux-terminal

  shellcheck:
    name: ShellCheck and profile validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Lint shell scripts
        run: scripts/lint-shell

      - name: Test Quattro shell compatibility overlay
        run: os/linux/hyprland/quattro-lab/scripts/test-shell-compat

      - name: Test AeroSpace workspace configuration and highlight in isolation
        run: python3 os/macos/aerospace/scripts/test-workspaces.py

      - name: Validate repository metadata and profile graph
        run: |
          scripts/test-profile-resolve
          scripts/validate-profiles
          scripts/validate-hosts
          scripts/validate-references

      - name: Rebuild macOS profile in an isolated HOME
        shell: bash
        run: |
          test_home=$(mktemp -d)
          HOME="$test_home" scripts/link macos-main
          HOME="$test_home" scripts/doctor macos-main

      - name: Rebuild Linux profiles in isolated homes
        shell: bash
        run: |
          for profile in arch-workstation arch-dwm arch-hyprland arch-hyprland-preview arch-hyprland-quattro-lab; do
            test_home=$(mktemp -d)
            HOME="$test_home" scripts/link "$profile"
            HOME="$test_home" scripts/doctor "$profile"
          done
