# Politica de seleccion de mirrors para Reflector 2023-5.
# Este archivo es la fuente de verdad; /etc/pacman.d/mirrorlist es estado
# dinamico generado por reflector.service.

--save /etc/pacman.d/mirrorlist
--protocol https
--completion-percent 100
--age 12
--latest 25
--sort rate
--number 10
--connection-timeout 5
--download-timeout 5
