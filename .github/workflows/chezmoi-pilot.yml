name: Chezmoi Pilot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chezmoi-pilot.yml"
      - "README.md"
      - "docs/chezmoi-pilot-result.md"
      - "docs/generated/chezmoi-pilot-*.md"
      - "docs/tooling/openspec-chezmoi.md"
      - "experiments/chezmoi-pilot/**"
      - "openspec/config.yaml"
      - "openspec/changes/evaluate-chezmoi-pilot/**"
      - "profiles/**"
      - "scripts/doctor"
      - "scripts/link"
      - "scripts/profile-resolve"
      - "scripts/test-profile-resolve"
      - "scripts/validate-hosts"
      - "scripts/validate-profiles"
      - "scripts/validate-references"
      - "shared/starship/**"
      - "shared/kitty/**"
      - "os/linux/kitty/**"
      - "os/macos/kitty/**"
      - "os/macos/aerospace/**"
  pull_request:
    paths:
      - ".github/workflows/chezmoi-pilot.yml"
      - "README.md"
      - "docs/chezmoi-pilot-result.md"
      - "docs/generated/chezmoi-pilot-*.md"
      - "docs/tooling/openspec-chezmoi.md"
      - "experiments/chezmoi-pilot/**"
      - "openspec/config.yaml"
      - "openspec/changes/evaluate-chezmoi-pilot/**"
      - "profiles/**"
      - "scripts/doctor"
      - "scripts/link"
      - "scripts/profile-resolve"
      - "scripts/test-profile-resolve"
      - "scripts/validate-hosts"
      - "scripts/validate-profiles"
      - "scripts/validate-references"
      - "shared/starship/**"
      - "shared/kitty/**"
      - "os/linux/kitty/**"
      - "os/macos/kitty/**"
      - "os/macos/aerospace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-isolated-pilot:
    name: Linux isolated Chezmoi matrix
    runs-on: ubuntu-22.04

    steps:
      - name: Install Ubuntu runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ca-certificates curl git shellcheck

      - name: Set up Python compatibility runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up pinned Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"

      - name: Install pinned evaluation tools
        env:
          CHEZMOI_SHA256: ba563f716d5c00a2e91d4aeb199b417c6b219db2896f890fd422fc72610b2d90
        run: |
          install -d -m 0755 "$HOME/.local/bin"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/chezmoi-linux-amd64" \
            https://github.com/twpayne/chezmoi/releases/download/v2.72.0/chezmoi-linux-amd64
          printf '%s  %s\n' "$CHEZMOI_SHA256" "$RUNNER_TEMP/chezmoi-linux-amd64" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/chezmoi-linux-amd64" "$HOME/.local/bin/chezmoi"
          npm install --global --prefix "$HOME/.local" --ignore-scripts \
            npm@12.0.2 @fission-ai/openspec@1.9.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "12.0.2"
          test "$(openspec --version)" = "1.9.0"
          chezmoi --version | grep --fixed-strings "v2.72.0"
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'

      - name: Require strict Bubblewrap containment
        run: |
          bwrap --die-with-parent --new-session \
            --ro-bind / / \
            --tmpfs /tmp \
            --proc /proc \
            --dev /dev \
            -- sh -c 'test -c /dev/null && test -d /proc && touch /tmp/pilot-smoke'

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run containment and cross-render matrix
        run: experiments/chezmoi-pilot/scripts/validate

      - name: Verify generated documentation
        run: experiments/chezmoi-pilot/scripts/generate-docs --check

      - name: Run pilot doctor
        run: experiments/chezmoi-pilot/scripts/doctor

      - name: Validate OpenSpec change
        run: |
          openspec validate evaluate-chezmoi-pilot --strict
          openspec validate --all --strict
          openspec doctor --json

      - name: Run repository validators
        run: |
          scripts/lint-shell
          scripts/test-profile-resolve
          scripts/validate-profiles
          scripts/validate-hosts
          scripts/validate-references

  native-windows-gate:
    name: Native Windows evidence gate
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - name: Gate remains intentionally disabled
        shell: pwsh
        run: throw 'Enable only after a reviewed native Windows runner and Chezmoi provenance gate exist.'
