general {
    hide_cursor = true
    grace = 1
}

background {
    monitor =
    color = rgb(1a1b26)
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] LC_TIME=C date +"%A, %B %d"
    color = rgb(a9b1d6)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(c0caf5)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    placeholder_text = <span foreground="##565f89">Password</span>
    fail_text = <span foreground="##f7768e">Authentication failed</span>
    position = 0, -90
    halign = center
    valign = center
}
