# Tokyo Night-inspired defaults adapted from Omarchy's modular look and feel.
$activeBorder = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
$inactiveBorder = rgba(444b6aaa)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $activeBorder
    col.inactive_border = $inactiveBorder
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(0d0f18aa)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        special = true
        brightness = 0.75
        contrast = 1.0
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 3, quick, popin 85%
    animation = border, 1, 5, easeOutQuint
    animation = fade, 1, 3, quick
    animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}
