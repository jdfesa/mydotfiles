# Preserve the shared configuration and keep Linux overrides here.
source-file "$HOME/mydotfiles/shared/tmux/tmux.conf"

set -g status-position bottom
# Preserve the default entries without duplicating ours on every reload.
if-shell -F '#{m:*WAYLAND_DISPLAY*,#{update-environment}}' '' 'set -ag update-environment " WAYLAND_DISPLAY"'
if-shell -F '#{m:*XDG_SESSION_TYPE*,#{update-environment}}' '' 'set -ag update-environment " XDG_SESSION_TYPE"'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"$HOME/mydotfiles/os/linux/tmux/copy-to-clipboard"'

# The upstream battery script assumes a battery exists; desktop PCs have none.
if-shell 'grep -qs "^Battery$" /sys/class/power_supply/*/type' '' 'set -Fg status-right "#{s/  󱊣 .*//:status-right}"'
