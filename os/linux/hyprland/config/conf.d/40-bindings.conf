$mainMod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$fileManager = uwsm-app -- thunar --window
$browser = helium-browser

# Applications and session controls.
bindd = $mainMod, RETURN, Terminal, exec, $terminal
bindd = $mainMod, SPACE, Application launcher, exec, $launcher
bindd = $mainMod SHIFT, F, File manager, exec, $fileManager
bindd = $mainMod SHIFT, B, Browser, exec, $browser
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod ALT, L, Lock session, exec, pidof hyprlock || hyprlock
bindd = $mainMod SHIFT, E, Session menu, exec, /bin/sh -lc '$HOME/.local/bin/wayland-power-menu'
bindd = $mainMod SHIFT, A, Audio settings, exec, uwsm-app -- pavucontrol

# Window state.
bindd = $mainMod, F, Fullscreen, fullscreen, 0
bindd = $mainMod, V, Toggle floating, togglefloating,
bindd = $mainMod, P, Pseudo tile, pseudo,
bindd = $mainMod ALT, J, Toggle split, layoutmsg, togglesplit

# Focus and movement with Vim-style directions.
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize the active window.
binde = $mainMod CTRL, H, resizeactive, -20 0
binde = $mainMod CTRL, L, resizeactive, 20 0
binde = $mainMod CTRL, K, resizeactive, 0 -20
binde = $mainMod CTRL, J, resizeactive, 0 20

# Workspaces.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse move/resize.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots.
bindd = , PRINT, Capture region, exec, /bin/sh -lc '$HOME/.local/bin/wayland-screenshot region'
bindd = SHIFT, PRINT, Capture screen, exec, /bin/sh -lc '$HOME/.local/bin/wayland-screenshot full'

# Audio and media keys work while locked.
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Toggle microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = , XF86AudioPlay, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# Desktop keyboards do not always expose multimedia keysyms.
bindeld = $mainMod, F12, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = $mainMod, F11, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = $mainMod, F10, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
