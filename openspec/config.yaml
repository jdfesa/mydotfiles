schema: spec-driven

context: |
  Este repositorio mantiene una fuente de verdad versionada para reconstruir
  estaciones de trabajo. La raíz del checkout actual es la identidad portable
  del repositorio; `~/mydotfiles` es solo una ubicación convencional y ninguna
  automatización puede depender de ella.

  Las responsabilidades permanecen separadas: `shared/<tool>` contiene fuentes
  portables; `os/<platform>/<tool>` contiene comportamiento específico de una
  plataforma o sesión; `profiles/` compone configuración de usuario reusable;
  `hosts/` registra hechos y política de máquinas físicas; `hardware/` contiene
  periféricos; `scripts/` mantiene el repositorio; y `docs/` explica arquitectura,
  restauración y operación. X11, Wayland, desktop sessions y diferencias de host
  deben seguir explícitos.

  El bootstrap objetivo se descompone en prerrequisitos, adquisición del source,
  configuración de usuario, paquetes y servicios, verificación y gates manuales
  de autenticación, permisos, secretos o reinicio. El tiempo total debe estar
  dominado por red e instalación, no por orquestación opaca. Cada cambio declara
  cuáles fases y plataformas modifica; no puede alterar otra plataforma por
  conveniencia.

  `scripts/profile-resolve`, `scripts/link` y los symlinks declarados continúan
  siendo el owner productivo de configuración de usuario. Chezmoi permanece como
  candidato no adoptado. Ansible es solo un candidato para paquetes, servicios,
  archivos privilegiados y orquestación. OpenSpec gobierna cambios, pero no
  despliega configuración. Dos mecanismos nunca administran el mismo target.

  Los cambios son incrementales, canary-first, planificables antes de aplicar,
  idempotentes y verificables. Una operación privilegiada debe ser explícita,
  acotada, respaldable y reversible. Un host nuevo o hardware desconocido debe
  producir diagnóstico o plan para revisión, no una mutación implícita.

  Secretos, tokens, claves privadas, credenciales, caches, builds, datos
  personales y estado mutable no se versionan. Los gates inevitables se
  documentan con dueño, momento y verificación; nunca se ocultan detrás de una
  afirmación de restauración completamente automática.

  Nombres de archivos y directorios, headings, nomenclatura técnica, metadata
  Git, Conventional Commits y texto de PR se escriben en inglés. La prosa
  explicativa se escribe en español profesional UTF-8, salvo keywords exigidas
  por herramientas o formatos externos.

rules:
  proposal:
    - Declarar scope, plataformas afectadas, non-goals, riesgos y path de rollback o no-adoption.
    - Separar estado administrado, estado detectado y gates manuales; no prometer reproducibilidad sin evidencia.
    - Identificar ownership actual y futuro sin superponer herramientas sobre un mismo target.
    - Preferir una fase pequeña y verificable antes que una migración amplia.
  specs:
    - Usar requisitos normativos SHALL o MUST y escenarios concretos WHEN/THEN.
    - Cubrir plan/dry-run, idempotencia, drift, fallos parciales, rollback, secretos y verificación.
    - Distinguir capacidades portables, políticas de plataforma y hechos de hardware o host.
    - Definir resultados observables y evidencia; una revisión humana no se presenta como test automatizado.
  design:
    - Mostrar límites de ownership, flujo de datos y fronteras de privilegios.
    - Explicar defaults, detección de hardware, overrides y comportamiento fail-closed.
    - Favorecer scripts y adaptadores explícitos sobre abstracciones que aumenten la complejidad total.
    - Definir estrategia de backup, rollback, drift y segunda ejecución sin cambios.
  tasks:
    - Ordenar trabajo por fases pequeñas, canary-first, con gates explícitos antes de apply, privilegios o promoción.
    - Incluir validación estática, pruebas aisladas, evidencia en host real y actualización documental.
    - Mantener unchecked todo trabajo futuro y no anticipar commits, publicación, merge o validación no ejecutados.
    - Exigir un inventario honesto de lo que permanece manual o fuera de alcance.

operations:
  apply:
    guidance:
      - Leer proposal, specs, design y tasks antes de editar implementación.
      - Mantener un único owner por target y detenerse ante conflicto, secreto o hardware no reconocido.
      - Ejecutar validaciones aisladas y dry-run antes de cualquier cambio real o privilegiado.
      - No modificar plataformas, hosts ni perfiles fuera del scope aprobado del change.
      - No aplicar cambios al host activo ni usar privilegios sin autorización explícita cuando el change lo requiera.
  archive:
    guidance:
      - Archivar solo después de validar implementación, documentación, rollback e idempotencia.
      - Mantener el estado de tareas históricamente honesto y sincronizar specs cuando corresponda.
