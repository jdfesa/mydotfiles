# ╔═══════════════════════════════════════════════════════════════════════╗
# ║              AeroSpace — Fase 2: Navegación + Ajuste                 ║
# ║                                                                      ║
# ║  Modificadores:                                                      ║
# ║    Hyper (cmd-ctrl-alt-shift) → Navegación (ir a workspace, foco)    ║
# ║    Meh   (ctrl-alt-shift)     → Acción (mover ventana)               ║
# ║                                                                      ║
# ║  Prueba: cinco workspaces numéricos (1–5)                           ║
# ║  Hyper + número = navegar | Meh + número = mover                   ║
# ╚═══════════════════════════════════════════════════════════════════════╝

config-version = 2
start-at-login = true

# ─── Normalización ─────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ─── Layout por defecto ────────────────────────────────────────────────
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ─── Mouse sigue al foco cuando cambiás de monitor ────────────────────
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ─── Integración Sketchybar ──────────────────────────────────────────
# Notifica a Sketchybar cuando cambiás de workspace para actualizar la barra.
exec-on-workspace-change = ['/bin/bash', '-c',
    '$HOME/mydotfiles/os/macos/aerospace/scripts/update_sketchybar_workspace.sh'
]

# ─── Workspaces persistentes (distribución en prueba, revisable) ──────
# 1 = Navegadores
# 2 = Trabajo y terminales
# 3 = Notas y documentos
# 4 = Finder y utilidades
# 5 = Calendario, comunicación y multimedia
persistent-workspaces = ["1", "2", "3", "4", "5"]

# ─── Gaps ─────────────────────────────────────────────────────────────
[gaps]
    inner.horizontal = 0
    inner.vertical   = 0
    outer.left       = 6
    outer.bottom     = 6
    outer.right      = 6
    outer.top        = 42  # Espacio para Sketchybar (~36px barra + 6px gap)

# ─── Teclado QWERTY ─────────────────────────────────────────────────
[key-mapping]
    preset = 'qwerty'

# ═════════════════════════════════════════════════════════════════════
# ATAJOS — Modo Principal (main)
# ═════════════════════════════════════════════════════════════════════
#
# LÓGICA:
#   Hyper + número → IR al workspace (navegación)
#   Meh + número   → MOVER ventana al workspace (acción)
#   Solo se asignan los números 1–5; el resto de atajos no cambia.
#
# ═════════════════════════════════════════════════════════════════════
[mode.main.binding]

    # ─── TERMINAL: Launcher estilo Omarchy (Super = Cmd en macOS) ─────
    cmd-enter = 'exec-and-forget open -n -a kitty'

    # ─── WORKSPACE: Ir (Hyper + número) ──────────────────────────────
    cmd-alt-ctrl-shift-1 = 'workspace 1'       # Navegadores
    cmd-alt-ctrl-shift-2 = 'workspace 2'       # Trabajo y terminales
    cmd-alt-ctrl-shift-3 = 'workspace 3'       # Notas y documentos
    cmd-alt-ctrl-shift-4 = 'workspace 4'       # Finder y utilidades
    cmd-alt-ctrl-shift-5 = 'workspace 5'       # Calendario, comunicación y multimedia

    # ─── WORKSPACE: Mover ventana (Meh + número) ──────────────────────
    alt-ctrl-shift-1 = 'move-node-to-workspace 1'
    alt-ctrl-shift-2 = 'move-node-to-workspace 2'
    alt-ctrl-shift-3 = 'move-node-to-workspace 3'
    alt-ctrl-shift-4 = 'move-node-to-workspace 4'
    alt-ctrl-shift-5 = 'move-node-to-workspace 5'

    # ─── FOCO: Navegar entre ventanas (Hyper + H/J/K/L) ─────────────
    cmd-alt-ctrl-shift-h = 'focus left'
    cmd-alt-ctrl-shift-j = 'focus down'
    cmd-alt-ctrl-shift-k = 'focus up'
    cmd-alt-ctrl-shift-l = 'focus right'

    # ─── MOVER: Reposicionar ventana (Meh + H/J/K/L) ──────────────
    alt-ctrl-shift-h = 'move left'
    alt-ctrl-shift-j = 'move down'
    alt-ctrl-shift-k = 'move up'
    alt-ctrl-shift-l = 'move right'

    # ─── UTILIDADES ────────────────────────────────────────────────
    cmd-alt-ctrl-shift-tab = 'workspace-back-and-forth'    # Volver al workspace anterior
    cmd-alt-ctrl-shift-f = 'fullscreen'                    # Toggle fullscreen
    cmd-alt-ctrl-shift-a = 'layout tiles accordion'         # Toggle accordion

    # ─── AJUSTE DIRECTO ────────────────────────────────────────────────
    # Meh + B = Balance: vuelve el workspace a tiles horizontales y reparte.
    alt-ctrl-shift-b = [
        'layout tiling',
        'flatten-workspace-tree',
        'layout h_tiles',
        'balance-sizes',
    ]

    # Meh + F = Floating: alterna la ventana enfocada entre flotante y mosaico.
    alt-ctrl-shift-f = 'layout floating tiling'

    # ─── Modo Resize (Meh + M = Measure/Medir) ─────────────
    alt-ctrl-shift-m = [
        'mode resize',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh RESIZE',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh RESIZE',
    ]

    # ─── Modo Servicio (Meh + ;) ──────────────────────────────────
    alt-ctrl-shift-semicolon = [
        'mode service',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh SERVICE',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh SERVICE',
    ]

# ═════════════════════════════════════════════════════════════════════
# Modo Servicio — Mantenimiento rápido
# ═════════════════════════════════════════════════════════════════════
[mode.service.binding]
    esc = [
        'reload-config',
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]
    enter = [
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]
    r = [
        'flatten-workspace-tree',
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]
    f = [
        'layout floating tiling',
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]
    b = [
        'balance-sizes',
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]

# ═════════════════════════════════════════════════════════════════════
# Modo Resize — Ajuste de tamaños
# ═════════════════════════════════════════════════════════════════════
[mode.resize.binding]
    esc = [
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]
    enter = [
        'mode main',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/update_mode_indicator.sh NORMAL',
        'exec-and-forget $HOME/mydotfiles/os/macos/aerospace/scripts/borders_mode.sh NORMAL',
    ]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    b = 'balance-sizes'

# ═════════════════════════════════════════════════════════════════════
# Reglas de ruteo de ventanas (App routing)
# ═════════════════════════════════════════════════════════════════════

