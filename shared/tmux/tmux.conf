# Keep tmux's default prefix and shortcuts. New terminals follow the active
# pane's working directory instead of returning to the session's start path.
bind-key -N 'Create a window in the current directory' c new-window -c '#{pane_current_path}'
bind-key -N 'Split left and right in the current directory' '%' split-window -h -c '#{pane_current_path}'
bind-key -N 'Split top and bottom in the current directory' '"' split-window -v -c '#{pane_current_path}'
