# Linux Kitty entrypoint.
# Keep platform modifier names here instead of leaking them into shared config.
kitty_mod super+alt

include $HOME/mydotfiles/shared/kitty/common.conf

# Match the macOS workflow: tmux owns sessions; Kitty keeps its appearance.
startup_session none
shell_integration no-sudo
tab_title_template "{tab.active_wd.rsplit('/', 1)[-1]}"
map ctrl+b
map ctrl+shift+s

# Forward navigation to tmux as well as Neovim instead of moving Kitty panes.
map ctrl+j kitten pass_keys.py bottom ctrl+j "nvim|tmux"
map ctrl+k kitten pass_keys.py top    ctrl+k "nvim|tmux"
map ctrl+h kitten pass_keys.py left   ctrl+h "nvim|tmux"
map ctrl+l kitten pass_keys.py right  ctrl+l "nvim|tmux"

# Conventional Linux clipboard shortcuts must be handled by Kitty before a
# terminal application can interpret Ctrl+V for another action.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+super+alt+u goto_layout tall
map ctrl+super+alt+i goto_layout fat
map ctrl+super+alt+o goto_layout stack

map ctrl+super+, load_config_file
map super+enter new_window
map ctrl+super+h swap_with_window

map ctrl+super+alt+h resize_window narrower
map ctrl+super+alt+l resize_window wider
map ctrl+super+alt+k resize_window taller
map ctrl+super+alt+j resize_window shorter 3

map super+t new_tab_with_cwd
